name: Deploy

# Build, push to the homelab Nexus registry, and roll out to homelab-k8s.
# One-time setup (namespace, pull secret, RBAC, GitHub secrets): deploy/ci/README.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to roll out (skips build). Blank = build current commit."
        required: false
        default: ""

concurrency:
  group: deploy-homelab-akisok-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: homelab-k8s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Nexus
        run: echo "${{ secrets.NEXUS_PUSH_PASSWORD }}" | docker login nexus-lan.keresifon.com -u "${{ secrets.NEXUS_PUSH_USER }}" --password-stdin

      - name: Kubeconfig (github-deployer, akisok namespace only)
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      # The runner pod image does not always ship kubectl; deploy.sh needs it.
      - name: Ensure kubectl on PATH
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1; then
            KUBECTL="$(command -v kubectl)"
          else
            KUBECTL=""
            for candidate in /usr/local/bin/kubectl /usr/bin/kubectl "$HOME/bin/kubectl"; do
              if [ -x "$candidate" ]; then
                KUBECTL="$candidate"
                break
              fi
            done
            if [ -z "$KUBECTL" ]; then
              mkdir -p "$HOME/bin"
              curl -fsSL -o "$HOME/bin/kubectl" https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
              chmod +x "$HOME/bin/kubectl"
              KUBECTL="$HOME/bin/kubectl"
            fi
            echo "PATH=$(dirname "$KUBECTL"):$PATH" >> "$GITHUB_ENV"
          fi
          echo "Using kubectl at $KUBECTL"
          "$KUBECTL" version --client

      - name: Build, push and roll out
        env:
          SYNC_SECRETS: "0"
          TAG: ${{ github.event.inputs.tag }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          chmod +x deploy/deploy.sh
          if [ -n "$TAG" ]; then deploy/deploy.sh apply; else unset TAG; deploy/deploy.sh all; fi

      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n akisok get pods -o wide || true
          kubectl -n akisok get events --sort-by=.lastTimestamp | tail -20 || true

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kube"
          docker logout nexus-lan.keresifon.com || true
