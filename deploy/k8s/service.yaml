apiVersion: v1
kind: Service
metadata:
  name: akisok-site
  namespace: akisok
  annotations:
    # Cilium LB-IPAM: distinct from quephase .240, finance .241, keresifon .242, kwesiblack .243.
    lbipam.cilium.io/ips: "192.168.2.244"
spec:
  type: LoadBalancer
  selector: {app: akisok-site}
  ports:
    - name: http
      port: 3000
      targetPort: http
